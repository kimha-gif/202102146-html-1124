<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Frame Space Planets</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-troika-text/dist/aframe-troika-text.min.js"></script>
    <script>
      AFRAME.registerComponent("starfield", {
        init: function () {
          var group = document.createElement("a-entity");
          for (var i = 0; i < 500; i += 1) {
            var star = document.createElement("a-sphere");
            var radius = 70;
            var phi = Math.random() * Math.PI * 2;
            var costheta = Math.random() * 2 - 1;
            var theta = Math.acos(costheta);
            var x = radius * Math.sin(theta) * Math.cos(phi);
            var y = radius * Math.sin(theta) * Math.sin(phi);
            var z = radius * Math.cos(theta);

            star.setAttribute("position", x + " " + y + " " + z);
            star.setAttribute("radius", 0.06 + Math.random() * 0.06);
            star.setAttribute("color", "#ffffff");
            star.setAttribute("material", "shader: flat; emissive: #ffffff; emissiveIntensity: 1;");
            group.appendChild(star);
          }
          this.el.appendChild(group);
        },
      });
    </script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020617;
      }
    </style>
  </head>
  <body>
    <a-scene background="color: #020617">
      <a-entity starfield></a-entity>

      <a-entity light="type: ambient; color: #667085; intensity: 0.8"></a-entity>
      <a-entity
        light="type: point; color: #ffffff; intensity: 1.2; distance: 90"
        position="0 6 6"
      ></a-entity>

      <a-entity id="camera-rig" position="0 1.6 0">
        <a-camera position="0 0 0"></a-camera>

        <a-entity
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4500; easing: linear;"
        >
          <a-entity
            troika-text="value: a; font: https://fonts.gstatic.com/s/nanumgothic/v23/PN_oRfi-oW3hYwmKDpxS7F_z_tLfxno73g.woff2; fontSize: 0.9; color: #f97316; anchorX: center; anchorY: middle; outlineWidth: 0.03; outlineColor: #ffffff;"
            position="2.8 0.2 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 2200; easing: linear;"
          ></a-entity>
        </a-entity>

        <a-entity
          rotation="14 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 7000; easing: linear;"
        >
          <a-entity
            troika-text="value: b; font: https://fonts.gstatic.com/s/nanumgothic/v23/PN_oRfi-oW3hYwmKDpxS7F_z_tLfxno73g.woff2; fontSize: 0.9; color: #38bdf8; anchorX: center; anchorY: middle; outlineWidth: 0.03; outlineColor: #ffffff;"
            position="4.2 -0.1 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear;"
          ></a-entity>
        </a-entity>

        <a-entity
          rotation="-10 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 10200; easing: linear;"
        >
          <a-entity
            troika-text="value: c; font: https://fonts.gstatic.com/s/nanumgothic/v23/PN_oRfi-oW3hYwmKDpxS7F_z_tLfxno73g.woff2; fontSize: 0.9; color: #a3e635; anchorX: center; anchorY: middle; outlineWidth: 0.03; outlineColor: #ffffff;"
            position="5.6 0.35 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 3800; easing: linear;"
          ></a-entity>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
